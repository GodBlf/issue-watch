name: CI and deploy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Do not interrupt a server while it is stopping or backing up its database.
concurrency:
  group: ${{ github.event_name == 'push' && 'production' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-1.90-${{ hashFiles('Cargo.lock') }}
      - name: Format and test
        run: |
          cargo +1.90.0 fmt --check
          cargo +1.90.0 test --locked
          node --test tests/health_dashboard_browser.cjs
          python3 -m unittest discover -s tests -p test_deploy.py -v
          bash -n deploy/install.sh
          sh -n deploy/ssh-entry

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/godblf/issue-watch:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/GodBlf/issue-watch
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify production Compose with isolated test data
        env:
          IMAGE: ghcr.io/godblf/issue-watch:sha-${{ github.sha }}
        run: python3 tests/container_smoke.py "$IMAGE"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name == 'push'
        id: publish
        env:
          IMAGE: ghcr.io/godblf/issue-watch:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$reference" =~ ^ghcr.io/godblf/issue-watch@sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${reference#*@}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Deploy immutable image through the restricted SSH entry
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/issue-watch-ssh"
          trap 'rm -f "$RUNNER_TEMP/issue-watch-ssh/key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/issue-watch-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/issue-watch-ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$RUNNER_TEMP/issue-watch-ssh/known_hosts" \
            -i "$RUNNER_TEMP/issue-watch-ssh/key" godblf@172.197.176.142 \
            "deploy ghcr.io/godblf/issue-watch@$IMAGE_DIGEST $REVISION"
