<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue Watch · 管理员登录</title>
<style>
:root{font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC",sans-serif;color:#1d1d1f;background:#f5f5f7;font-optical-sizing:auto}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:32px 20px}main{width:100%;max-width:420px;padding:40px;background:#fff;border:1px solid #e6e6eb;border-radius:24px;box-shadow:0 12px 48px #1d1d1f06}.brand-mark{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 24px;border-radius:16px;background:linear-gradient(145deg,#3699fa,#0067d8);box-shadow:0 4px 12px #0071e329;color:white;font-size:32px}h1{text-align:center;font-size:28px;letter-spacing:-.035em;margin:0 0 8px}.intro{text-align:center;color:#6e6e73;font-size:13px;margin:0 0 30px}label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}input,button{display:block;width:100%;min-height:46px;border-radius:10px;font:inherit;padding:10px 13px}input{border:1px solid #d2d2d7;background:#fff;color:#1d1d1f}button{border:0;margin-top:18px;background:#0071e3;color:#fff;font-weight:500;cursor:pointer;touch-action:manipulation;transition:transform 140ms ease-out,background-color 140ms ease-out}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:default}input:focus-visible,button:focus-visible{outline:3px solid #0071e355;outline-offset:3px}.hint{font-size:11px;text-align:center;color:#6e6e73;margin:22px 0 0}.recovery{margin:28px 0 0;padding-top:20px;border-top:1px solid #e8e8ed;font-size:12px;text-align:center;color:#6e6e73}[role=alert]{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#b32626;background:#fff3f1;padding:12px;border-radius:8px}[role=alert]:empty{display:none}@media(hover:hover){button:hover{background:#0077ed}}@media(max-width:480px){main{padding:32px 26px}}@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style></head><body><main><div class="brand-mark" aria-hidden="true">⌁</div><h1>Issue Watch</h1><p class="intro">登录管理控制台，关注每一条重要动态。</p><form id="login-form"><label for="password">管理员密码</label><input id="password" type="password" placeholder="输入管理员密码" autocomplete="current-password" required maxlength="1024"><button id="login-submit">登录</button></form><p id="login-message" role="alert"></p><p class="hint">登录状态最长保留一年</p><p class="recovery">忘记密码？通过 SSH 重置管理员密码。</p></main><script src="/login.js" defer></script></body></html>
